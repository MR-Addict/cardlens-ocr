name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: |
            out/downloads
            out/deps
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build.py', 'config/downloads.json') }}
      - name: Build native SDK
        run: python scripts/build.py native
      - name: Fetch reference inputs
        run: python tests/fetch_references.py
      - name: Check C++ SDK
        run: ctest --test-dir out/build/native -C Release --output-on-failure
      - name: Check Python SDK and C interface
        run: |
          python -m pip install ./sdk/python
          python tests/sdk_python.py
